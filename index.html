<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaron's Pizza Map</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    /* Floating Filter Bar */
    .filter-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.16);
      display: flex;
      align-items: center;
      transition: all 0.2s ease;
    }

    .filter-toggle-btn {
      display: none;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      box-sizing: border-box;
      text-align: left;
      user-select: none;
    }

    .toggle-pizza-icon {
      font-size: 15px;
      line-height: 1;
    }

    .toggle-filter-label {
      flex-grow: 1;
      white-space: nowrap;
    }

    .toggle-chevron {
      font-size: 11px;
      color: #64748b;
      transition: transform 0.2s ease;
      margin-left: 4px;
    }

    .filter-content {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-buttons-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-utility-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { background: #e2e8f0; }
    .filter-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .filter-separator {
      width: 1px;
      height: 22px;
      background: #cbd5e1;
      margin: 0 4px;
    }

    .theme-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .theme-btn:hover { background: #e2e8f0; }
    .theme-label { display: none; }

    .toggle-closed {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      user-select: none;
    }
    .toggle-closed input {
      cursor: pointer;
      accent-color: #ef4444;
    }

    /* Stack & Collapse filter options on narrow displays */
    @media (max-width: 768px) {
      .filter-bar {
        top: 12px;
        right: 12px;
        flex-direction: column;
        align-items: stretch;
        padding: 0;
        border-radius: 20px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
        min-width: 136px;
        max-width: 200px;
        overflow: hidden;
      }

      .filter-bar.open {
        border-radius: 12px;
      }

      .filter-toggle-btn {
        display: flex;
      }

      .filter-bar.open .toggle-chevron {
        transform: rotate(180deg);
      }

      .filter-content {
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 6px 8px 8px 8px;
        border-top: 1px solid #e2e8f0;
      }

      .filter-bar.open .filter-content {
        display: flex;
      }

      .filter-buttons-group {
        flex-direction: column;
        align-items: stretch;
        gap: 5px;
      }

      .filter-btn {
        text-align: left;
        padding: 6px 10px;
        font-size: 12px;
        width: 100%;
        box-sizing: border-box;
      }

      .filter-separator {
        width: 100%;
        height: 1px;
        margin: 2px 0;
      }

      .filter-utility-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
      }

      .toggle-closed {
        padding: 4px 6px;
        font-size: 12px;
        margin: 0;
      }

      .theme-btn {
        padding: 5px 8px;
        font-size: 12px;
      }

      .theme-label {
        display: inline;
        font-size: 11px;
      }
    }

    /* Dark Mode Theme */
    body.dark-mode {
      background: #0f172a;
    }
    body.dark-mode .filter-bar {
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    body.dark-mode .filter-toggle-btn {
      color: #f1f5f9;
    }
    body.dark-mode .toggle-chevron {
      color: #94a3b8;
    }
    body.dark-mode .filter-content {
      border-top-color: #334155;
    }
    body.dark-mode .filter-btn,
    body.dark-mode .theme-btn {
      border-color: #334155;
      background: #1e293b;
      color: #f1f5f9;
    }
    body.dark-mode .filter-btn:hover,
    body.dark-mode .theme-btn:hover {
      background: #334155;
    }
    body.dark-mode .filter-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: 600;
    }
    body.dark-mode .filter-separator {
      background: #334155;
    }
    body.dark-mode .toggle-closed {
      color: #94a3b8;
    }

    /* Popups in Dark Mode */
    body.dark-mode .leaflet-popup-content-wrapper,
    body.dark-mode .leaflet-popup-tip {
      background: #1e293b;
      color: #f8fafc;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55);
    }
    body.dark-mode .popup-title { color: #f8fafc; }
    body.dark-mode .popup-title.closed s { color: #94a3b8; }
    body.dark-mode .popup-meta { color: #94a3b8; }
    body.dark-mode .popup-address { color: #cbd5e1; }
    body.dark-mode .popup-notes { color: #e2e8f0; }
    body.dark-mode .popup-links { border-top-color: #334155; }
    body.dark-mode .popup-links a { color: #38bdf8; }

    /* Badges in Dark Mode */
    body.dark-mode .badge-two-star {
      background: #451a03;
      color: #fde68a;
      border-color: #78350f;
    }
    body.dark-mode .badge-one-star {
      background: #172554;
      color: #93c5fd;
      border-color: #1e40af;
    }
    body.dark-mode .badge-visited {
      background: #022c22;
      color: #6ee7b7;
      border-color: #065f46;
    }
    body.dark-mode .badge-closed {
      background: #450a0a;
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    /* Controls in Dark Mode */
    body.dark-mode .leaflet-bar a,
    body.dark-mode .locate-btn {
      background-color: #1e293b;
      color: #f8fafc;
      border-color: #334155;
    }
    body.dark-mode .leaflet-bar a:hover,
    body.dark-mode .locate-btn:active {
      background-color: #334155;
    }
    body.dark-mode .locate-btn svg {
      fill: #f1f5f9;
    }

    /* Popup Styling */
    .leaflet-popup-content-wrapper { border-radius: 8px; padding: 6px; }
    .popup-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; color: #0f172a; }
    .popup-title.closed s { color: #64748b; }
    .closed-tag { font-size: 12px; font-weight: 700; color: #ef4444; margin-left: 4px; }
    
    .popup-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 6px;
    }
    .badge-two-star { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-one-star { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .badge-visited  { background: #d1fae5; color: #047857; border: 1px solid #a7f3d0; }
    .badge-closed   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    .popup-meta { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .popup-address { font-size: 12px; color: #475569; margin-bottom: 6px; line-height: 1.3; }
    .popup-notes { font-size: 12px; font-style: italic; color: #334155; margin-bottom: 8px; }
    .popup-links { display: flex; gap: 10px; font-size: 12px; margin-top: 6px; border-top: 1px solid #f1f5f9; padding-top: 6px; }
    .popup-links a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .popup-links a:hover { text-decoration: underline; }

    /* Location Button (FAB) */
    .locate-btn {
      position: absolute;
      bottom: 24px;
      right: 20px;
      z-index: 1000;
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .locate-btn:active {
      background: #f0f0f0;
    }
    .locate-btn svg {
      width: 22px;
      height: 22px;
      fill: #333333;
    }
  </style>
</head>
<body>

  <div class="filter-bar" id="filterBar">
    <button id="filterToggle" class="filter-toggle-btn" aria-label="Toggle filters" title="Toggle filters">
      <span class="toggle-pizza-icon">🍕</span>
      <span class="toggle-filter-label" id="filterStatusLabel">Filters: All</span>
      <span class="toggle-chevron" id="filterChevron">▾</span>
    </button>

    <div class="filter-content" id="filterContent">
      <div class="filter-buttons-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="★★">★★ Excellent</button>
        <button class="filter-btn" data-filter="★">★ Recommend</button>
        <button class="filter-btn" data-filter="✓">✓ Visited</button>
      </div>
      <div class="filter-separator"></div>
      <div class="filter-utility-row">
        <label class="toggle-closed" title="Show or hide permanently closed venues">
          <input type="checkbox" id="toggleClosed" />
          <span>Closed</span>
        </label>
        <button id="themeToggle" class="theme-btn" title="Toggle dark / light mode" aria-label="Toggle dark / light mode">
          <span class="theme-icon">🌙</span><span class="theme-label">Theme</span>
        </button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <button id="locate-me" class="locate-btn" title="Find my location" aria-label="Find my location">
    <svg viewBox="0 0 24 24">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
  </button>

  <!-- Leaflet & PapaParse Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTBfwsJWM9BltaPVCYsrBSKaZD3iSo1T3ZybsRvfUTfE1CuZF3szp-FJDbkWuUGEFs0NmdBc4Ukqx3/pub?gid=1165000565&single=true&output=csv';

    /* 1. Initialise Map */
    var map = L.map('map').setView([40, -35], 3);

    // --- Geolocation FAB Logic ---
    var locateBtn = document.getElementById('locate-me');
    var userLocationMarker = null;

    if (locateBtn) {
      locateBtn.addEventListener('click', function(e) {
        e.preventDefault();
        // Tells Leaflet to find device location, center on it, and zoom in
        map.locate({ setView: true, maxZoom: 14, enableHighAccuracy: true });
      });
    }

    map.on('locationfound', function(e) {
      if (userLocationMarker) {
        userLocationMarker.setLatLng(e.latlng);
      } else {
        // Optional: keep the subtle accuracy ring so you know GPS precision
        L.circle(e.latlng, {
          radius: Math.max(e.accuracy || 25, 25),
          color: '#ff4444',
          weight: 1,
          fillColor: '#ff4444',
          fillOpacity: 0.12
        }).addTo(map);

        // Custom Pizza Hunter Pin
        var hunterIcon = L.divIcon({
          className: 'user-loc-hunter',
          html: '<div style="font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.45)); transform: translate(-2px, -2px);">🐱</div>',
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });

        userLocationMarker = L.marker(e.latlng, { 
          icon: hunterIcon, 
          zIndexOffset: 1000 // Keeps your location floating on top of nearby restaurant pins
        }).addTo(map);
      }
    });

    map.on('locationerror', function(e) {
      alert('Unable to find your location. Please ensure location services are enabled on your device.');
    });

    /* --- Tile Layers (Light & Dark) --- */
    var lightTileUrl = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}';
    var darkTileUrl  = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}';
    var tileAttr = 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ';

    var lightLayer = L.tileLayer(lightTileUrl, { attribution: tileAttr, maxZoom: 16 });
    var darkLayer  = L.tileLayer(darkTileUrl,  { attribution: tileAttr, maxZoom: 16 });

    /* 2. Custom Stacking Panes */
    map.createPane('closedPane');
    map.getPane('closedPane').style.zIndex = 350;

    map.createPane('visitedPane');
    map.getPane('visitedPane').style.zIndex = 380;

    map.createPane('starPane');
    map.getPane('starPane').style.zIndex = 410;

    map.createPane('topStarPane');
    map.getPane('topStarPane').style.zIndex = 420;

    /* 3. Layer Management */
    var markersGroup = L.featureGroup();
    map.addLayer(markersGroup);

    var allMarkers = [];
    var currentFilter = 'all';
    var showClosed = false;
    var isDarkMode = false;

/* Marker color resolver: softened, cohesive palette for dark mode */
function getMarkerColors(meta, isDark) {
  if (meta.isClosed) {
    return {
      fillColor: isDark ? '#ef4444' : '#ef4444',
      strokeColor: isDark ? '#475569' : '#94a3b8',
      radius: 4.5,
      opacity: isDark ? 0.45 : 0.5,
      weight: 1
    };
  } else if (meta.isTwoStar) {
    return {
      fillColor: isDark ? '#f59e0b' : '#d97706',           // Warm Honey Amber
      strokeColor: isDark ? 'rgba(255, 255, 255, 0.35)' : '#ffffff', // Soft translucent halo
      radius: 7.5,
      opacity: isDark ? 0.9 : 0.95,
      weight: isDark ? 1 : 1.5
    };
  } else if (meta.isOneStar) {
    return {
      fillColor: isDark ? '#60a5fa' : '#2563eb',           // Soft Cornflower Blue
      strokeColor: isDark ? 'rgba(255, 255, 255, 0.25)' : '#ffffff',
      radius: 6,
      opacity: isDark ? 0.85 : 0.9,
      weight: isDark ? 1 : 1.5
    };
  } else {
    return {
      fillColor: isDark ? '#10b981' : '#10b981',           // Muted Emerald / Sage
      strokeColor: isDark ? 'rgba(255, 255, 255, 0.2)' : '#ffffff',
      radius: 5.5,
      opacity: isDark ? 0.75 : 0.9,                        // Calmer opacity for majority pins
      weight: isDark ? 1 : 1.5
    };
  }
}

    function updateMarkerStyles(isDark) {
      allMarkers.forEach(function(m) {
        var c = getMarkerColors(m.meta, isDark);
        m.setStyle({
          fillColor: c.fillColor,
          color: c.strokeColor,
          radius: c.radius,
          fillOpacity: c.opacity
        });
      });
    }

    /* Marker helper */
    function createCircleMarker(lat, lng, isClosed, isTwoStar, isOneStar) {
      var pane = 'visitedPane';
      if (isClosed) { pane = 'closedPane'; }
      else if (isTwoStar) { pane = 'topStarPane'; }
      else if (isOneStar) { pane = 'starPane'; }

      var meta = { isClosed: isClosed, isTwoStar: isTwoStar, isOneStar: isOneStar };
      var c = getMarkerColors(meta, isDarkMode);

      return L.circleMarker([lat, lng], {
        pane: pane,
        radius: c.radius,
        fillColor: c.fillColor,
        color: c.strokeColor,
        weight: 1.5,
        fillOpacity: c.opacity
      });
    }

    /* 4. Parse CSV and build pins */
    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        results.data.forEach(function(row) {
          var lat = parseFloat(row.Lat);
          var lng = parseFloat(row.Lng);
          var venue = row.Venue || 'Pizzeria';
          var rating = (row.Rating || '').trim();
          var address = row.Address || '';
          var notes = row.Notes || '';
          var date = row.Date || '';
          var venueUrl = (row['Venue URL'] || '').trim();
          var visitUrl = (row['Visit URL'] || '').trim();

          if (!isNaN(lat) && !isNaN(lng)) {
            var isClosed = rating.indexOf('×') !== -1;
            var isTwoStar = rating.indexOf('★★') !== -1;
            var isOneStar = !isTwoStar && (rating.indexOf('★') !== -1);

            var marker = createCircleMarker(lat, lng, isClosed, isTwoStar, isOneStar);

            var badgeHtml = '<span class="popup-badge badge-visited">✓ Visited</span>';
            if (isClosed) {
              badgeHtml = '<span class="popup-badge badge-closed">× Permanently Closed</span>';
            } else if (isTwoStar) {
              badgeHtml = '<span class="popup-badge badge-two-star">★★ Excellent</span>';
            } else if (isOneStar) {
              badgeHtml = '<span class="popup-badge badge-one-star">★ Recommend</span>';
            }

            var linksHtml = '';
            if (visitUrl) { linksHtml += '<a href="' + visitUrl + '" target="_blank" rel="noopener">Post ↗</a>'; }
            if (venueUrl) { linksHtml += '<a href="' + venueUrl + '" target="_blank" rel="noopener">Website ↗</a>'; }

            var titleHtml = isClosed
              ? '<div class="popup-title closed"><s>' + venue + '</s><span class="closed-tag">(Closed)</span></div>'
              : '<div class="popup-title">' + venue + '</div>';

            var mapNavUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((venue ? venue + ' ' : '') + address);

            var addressHtml = address
              ? '<div class="popup-address"><a href="' + mapNavUrl + '" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: underline;">' + address + '</a></div>'
              : '';

            var popupContent = titleHtml +
              '<div>' + badgeHtml + '</div>' +
              (date ? '<div class="popup-meta">Last visited: ' + date + '</div>' : '') +
              addressHtml +
              (notes ? '<div class="popup-notes">"' + notes + '"</div>' : '') +
              (linksHtml ? '<div class="popup-links">' + linksHtml + '</div>' : '');

            marker.bindPopup(popupContent);

            marker.meta = {
              isClosed: isClosed,
              isTwoStar: isTwoStar,
              isOneStar: isOneStar
            };

            allMarkers.push(marker);
          }
        });

        applyFilters();

        var isMobile = window.innerWidth <= 768;

        if (isMobile) {
          // Sets a direct view on mobile so it doesn't zoom too far out on narrow screens
          map.setView([38.0, -40.0], 3);
        } else {
          // Desktop / wide screens: fit US and Europe across the width
          var defaultBounds = L.latLngBounds(
            [24.0, -125.0], 
            [58.0, 16.0]
          );
          map.fitBounds(defaultBounds, { padding: [20, 20] });
        }
      }
    });

    /* 5. Filter logic */
    function applyFilters() {
      markersGroup.clearLayers();
      allMarkers.forEach(function(m) {
        if (m.meta.isClosed && !showClosed) { return; }

        if (currentFilter === 'all') {
          markersGroup.addLayer(m);
        } else if (currentFilter === '★★' && m.meta.isTwoStar) {
          markersGroup.addLayer(m);
        } else if (currentFilter === '★' && m.meta.isOneStar) {
          markersGroup.addLayer(m);
        } else if (currentFilter === '✓' && (!m.meta.isTwoStar && !m.meta.isOneStar)) {
          markersGroup.addLayer(m);
        }
      });
    }

    /* 6. Event listeners */
    var filterBar = document.getElementById('filterBar');
    var filterToggleBtn = document.getElementById('filterToggle');
    var filterStatusLabel = document.getElementById('filterStatusLabel');

    if (filterBar) {
      L.DomEvent.disableClickPropagation(filterBar);
      L.DomEvent.disableScrollPropagation(filterBar);
    }

    if (filterToggleBtn && filterBar) {
      filterToggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        filterBar.classList.toggle('open');
      });
    }

    // Close mobile filter dropdown when tapping anywhere on the map
    map.on('click', function() {
      if (filterBar && filterBar.classList.contains('open')) {
        filterBar.classList.remove('open');
      }
    });

    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');

        // Update mobile pill label
        if (filterStatusLabel) {
          var labelText = 'Filters: ' + (currentFilter === 'all' ? 'All' : currentFilter);
          filterStatusLabel.textContent = labelText;
        }

        applyFilters();

        // Auto-collapse on mobile once an option is selected
        if (window.innerWidth <= 768 && filterBar) {
          filterBar.classList.remove('open');
        }
      });
    });

    document.getElementById('toggleClosed').addEventListener('change', function(e) {
      showClosed = e.target.checked;
      applyFilters();
    });

    /* --- Theme Toggle & Persistence Logic --- */
    function applyTheme(dark) {
      isDarkMode = dark;
      if (isDarkMode) {
        document.body.classList.add('dark-mode');
        if (map.hasLayer(lightLayer)) { map.removeLayer(lightLayer); }
        if (!map.hasLayer(darkLayer)) { darkLayer.addTo(map); }
        var iconEl = document.querySelector('.theme-icon');
        if (iconEl) iconEl.textContent = '☀️';
        var labelEl = document.querySelector('.theme-label');
        if (labelEl) labelEl.textContent = ' Light';
        var btn = document.getElementById('themeToggle');
        if (btn) btn.setAttribute('title', 'Switch to light mode');
      } else {
        document.body.classList.remove('dark-mode');
        if (map.hasLayer(darkLayer)) { map.removeLayer(darkLayer); }
        if (!map.hasLayer(lightLayer)) { lightLayer.addTo(map); }
        var iconEl = document.querySelector('.theme-icon');
        if (iconEl) iconEl.textContent = '🌙';
        var labelEl = document.querySelector('.theme-label');
        if (labelEl) labelEl.textContent = ' Dark';
        var btn = document.getElementById('themeToggle');
        if (btn) btn.setAttribute('title', 'Switch to dark mode');
      }
      updateMarkerStyles(isDarkMode);
    }

    function toggleTheme() {
      var next = !isDarkMode;
      localStorage.setItem('pizza_map_theme', next ? 'dark' : 'light');
      applyTheme(next);
    }

    var themeBtn = document.getElementById('themeToggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', toggleTheme);
    }

    // Initialize theme: saved preference -> OS preference fallback
    var savedTheme = localStorage.getItem('pizza_map_theme');
    var systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var startDark = savedTheme !== null ? (savedTheme === 'dark') : systemPrefersDark;
    applyTheme(startDark);

    // Watch for OS theme changes if user has not set a manual preference
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (localStorage.getItem('pizza_map_theme') === null) {
          applyTheme(e.matches);
        }
      });
    }
  </script>
</body>
